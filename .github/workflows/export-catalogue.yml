name: Export catalogue JSON
on:
  workflow_dispatch:
  push:
    paths:
      - 'Component/**/*.json'
      - 'scripts/export_catalogue.py'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install XlsxWriter
      - run: python scripts/export_catalogue.py
      - name: Commit separate workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Configuration_Catalogue.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Configuration_Catalogue.xlsx"
            git push
          fi
