name: Refresh configuration workbook
on:
  workflow_dispatch:
  push:
    paths:
      - 'Component/**/*.json'
      - 'scripts/sync_components.py'
      - 'requirements.txt'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/sync_components.py
      - name: Commit generated workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Configuration.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Configuration.xlsx"
            git push
          fi
